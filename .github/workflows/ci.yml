name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma validate
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/symphony
          DIRECT_URL: postgresql://user:pass@localhost:5432/symphony
      - run: npm run build
