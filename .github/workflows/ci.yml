name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: symphony_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d symphony_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/symphony_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/symphony_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/symphony_test
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma validate && npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck && npm test
      - run: npm audit --audit-level=high
      - run: npm run ingest:json -- fixtures/ingestion/azbyka.metadata-only.json
      - run: npm run ingest:json -- fixtures/ingestion/legal-seed-russyn.json
      - run: npm run seed:publish -- ci-source-byte-verification docs/SEED_SOURCE.md
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build non-root release image and smoke against disposable PostgreSQL
        run: |
          set -euo pipefail
          docker build --tag symphony-ci:verified .
          test "$(docker inspect --format '{{.Config.User}}' symphony-ci:verified)" = node
          docker run --detach --name symphony-ci --network host \
            -e DATABASE_URL -e DIRECT_URL \
            -e APP_ORIGIN=http://127.0.0.1:34392 -e PORT=34392 \
            -e RELEASE_SHA="$GITHUB_SHA" symphony-ci:verified
          trap 'docker logs symphony-ci; docker rm -f symphony-ci' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:34392/api/health > /tmp/symphony-health.json; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          docker exec symphony-ci node -e "fetch('http://127.0.0.1:'+process.env.PORT+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          jq -e --arg sha "$GITHUB_SHA" '.status == "ok" and .revision == $sha' /tmp/symphony-health.json
          curl --fail --silent http://127.0.0.1:34392/corpus > /tmp/symphony-corpus.html
          grep -q 'Синодальный' /tmp/symphony-corpus.html
          test "$(curl --silent --output /tmp/symphony-intake.json --write-out '%{http_code}' -X POST http://127.0.0.1:34392/api/questions)" = 503
          jq -e '.error == "intake_disabled"' /tmp/symphony-intake.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 7
