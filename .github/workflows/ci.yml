name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: symphony
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d symphony"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/symphony
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/symphony
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run ingest:json -- fixtures/ingestion/azbyka.metadata-only.json
      - name: Verify full-text rights gate
        run: |
          if npm run ingest:json -- fixtures/ingestion/denied-full-text.json; then
            echo "FULL_TEXT rights gate unexpectedly allowed LINK_ONLY"
            exit 1
          fi
          echo "FULL_TEXT rights gate correctly denied LINK_ONLY"
      - run: npm run build
